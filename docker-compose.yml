networks:
  app-network:
    driver: bridge

services:
  embedding-server:
    build: .
    image: embedding-server:latest
    container_name: embedding-server
    ports:
      - "5001:5001"
    environment:
      - PORT=5001
      - PYTHONUNBUFFERED=1
      - TRANSFORMERS_CACHE=/home/appuser/.cache/torch/sentence_transformers
      - TORCH_HOME=/home/appuser/.cache/torch
      - HF_HOME=/home/appuser/.cache/huggingface
    restart: unless-stopped
    networks:
      - app-network
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:5001/health')"]
      interval: 30s
      timeout: 15s
      retries: 5
      start_period: 120s
    # Resource limits for memory efficiency - optimized for all-mpnet-base-v2
    deploy:
      resources:
        limits:
          memory: 3G
        reservations:
          memory: 1.5G

